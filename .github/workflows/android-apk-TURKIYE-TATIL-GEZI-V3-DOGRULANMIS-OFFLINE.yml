name: Turkiye Tatil Gezi V3 Dogrulanmis Offline APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 36 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: V3 ZIP'i bul ve ac
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'turkiye_tatil_gezi_rehberi_V3_DOGRULANMIS_OFFLINE*.zip' | sort | tail -n 1)"
          if [ -z "$ZIP" ]; then
            echo "V3 ZIP bulunamadi"
            exit 1
          fi
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project
          echo "Kullanilan ZIP: $ZIP"

      - name: Dogrulanmis katalog testleri
        working-directory: project
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: APK derle
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turkiye-Tatil-Gezi-V3-Dogrulanmis-Offline-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
